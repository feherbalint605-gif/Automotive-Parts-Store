openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the automotive parts storefront and administration
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: products
  - name: orders
  - name: messages
  - name: content
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List active storefront products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductCategory"
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a customer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
  /messages:
    post:
      operationId: createMessage
      tags: [messages]
      summary: Send a contact message or custom-print request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message
  /content:
    get:
      operationId: getSiteContent
      tags: [content]
      summary: Get public site content
      responses:
        "200":
          description: Site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the private admin dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuth"
        "401":
          description: Invalid credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out of the admin dashboard
      responses:
        "204":
          description: Signed out
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check whether the current browser is signed in
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuth"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard counts
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Admin sign-in required
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin, orders]
      summary: List customer orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Admin sign-in required
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      tags: [admin, orders]
      summary: Update an order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Admin sign-in required
        "404":
          description: Order not found
  /admin/messages:
    get:
      operationId: listAdminMessages
      tags: [admin, messages]
      summary: List contact messages and custom-print requests
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Admin sign-in required
  /admin/content:
    put:
      operationId: updateSiteContent
      tags: [admin, content]
      summary: Update the public site copy and hero image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "200":
          description: Updated site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "401":
          description: Admin sign-in required
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin, products]
      summary: List all products, including hidden products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Admin sign-in required
    post:
      operationId: createAdminProduct
      tags: [admin, products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Admin sign-in required
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags: [admin, products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Admin sign-in required
        "404":
          description: Product not found
    delete:
      operationId: deleteAdminProduct
      tags: [admin, products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted product
        "401":
          description: Admin sign-in required
        "404":
          description: Product not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductCategory:
      type: string
      enum:
        - magnetic_license_plates
        - carbon_fiber_parts
        - custom_3d_printing
    Product:
      type: object
      properties:
        id:
          type: integer
        category:
          $ref: "#/components/schemas/ProductCategory"
        title:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, category, title, description, price, imageUrl, active, createdAt]
    ProductInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ProductCategory"
        title:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: string
        active:
          type: boolean
      required: [category, title, description, price, imageUrl, active]
    ProductUpdate:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ProductCategory"
        title:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: string
        active:
          type: boolean
    OrderItemInput:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 50
      required: [productId, quantity]
    OrderItem:
      type: object
      properties:
        productId:
          type: integer
        title:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
      required: [productId, title, quantity, unitPrice]
    OrderStatus:
      type: string
      enum: [pending, shipped, cancelled]
    PaymentMethod:
      type: string
      enum: [cash_on_delivery, bank_transfer]
    OrderInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 3
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
      required: [customerName, address, email, phone, paymentMethod, items]
    Order:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        address:
          type: string
        email:
          type: string
        phone:
          type: string
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time
      required: [id, customerName, address, email, phone, paymentMethod, items, total, status, createdAt]
    OrderStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
      required: [status]
    MessageKind:
      type: string
      enum: [contact, print_request]
    MessageInput:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/MessageKind"
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        details:
          type: string
          minLength: 1
        fileName:
          type: ["string", "null"]
      required: [kind, name, email, details]
    Message:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/MessageKind"
        name:
          type: string
        email:
          type: string
        details:
          type: string
        fileName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, kind, name, email, details, fileName, createdAt]
    HomePageTextBox:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          maxLength: 200
        bodyText:
          type: string
          maxLength: 5000
      required: [id, title, bodyText]
    HomePageFeatureItem:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          maxLength: 200
        bodyText:
          type: string
          maxLength: 2000
      required: [id, title, bodyText]
    HomePageSectionContent:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        subtitle:
          type: string
          maxLength: 500
        bodyText:
          type: string
          maxLength: 10000
        imageUrl:
          type: string
          maxLength: 2048
        buttonText:
          type: string
          maxLength: 100
        buttonUrl:
          type: string
          maxLength: 2048
        formKind:
          type: string
          enum: [contact, print_request]
        textBoxes:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/HomePageTextBox"
        featureItems:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/HomePageFeatureItem"
      required: [title, subtitle, bodyText, imageUrl, buttonText, buttonUrl, formKind, textBoxes, featureItems]
    HomePageSectionStyle:
      type: object
      properties:
        align:
          type: string
          enum: [left, center, right]
        columns:
          type: string
          enum: [one, two, asymmetric]
        imagePosition:
          type: string
          enum: [left, right, top, background]
        padding:
          type: string
          enum: [compact, normal, large, full]
        bgStyle:
          type: string
          enum: [slate, black, outline, carbon]
        textColor:
          type: string
          enum: [light, accent, muted]
        accentMode:
          type: string
          enum: [brand, custom]
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
      required: [align, columns, imagePosition, padding, bgStyle, textColor, accentMode, accentColor]
    HomePageSection:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum: [hero, banner, text_image, features, custom_form]
        order:
          type: integer
          minimum: 0
        layout:
          type: string
          enum: [image_left, image_right, centered]
        content:
          $ref: "#/components/schemas/HomePageSectionContent"
        style:
          $ref: "#/components/schemas/HomePageSectionStyle"
      required: [id, type, order, layout, content, style]
    SiteContent:
      type: object
      properties:
        heroTitle:
          type: string
        heroSubtitle:
          type: string
        heroImageUrl:
          type: string
        aboutTitle:
          type: string
        aboutBody:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        instagramUrl:
          type: string
        facebookUrl:
          type: string
        sections:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/HomePageSection"
      required: [heroTitle, heroSubtitle, heroImageUrl, aboutTitle, aboutBody, contactEmail, contactPhone, instagramUrl, facebookUrl, sections]
    SiteContentInput:
      type: object
      properties:
        heroTitle:
          type: string
          minLength: 1
        heroSubtitle:
          type: string
        heroImageUrl:
          type: string
        aboutTitle:
          type: string
        aboutBody:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        instagramUrl:
          type: string
        facebookUrl:
          type: string
        sections:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/HomePageSection"
      required: [heroTitle, heroSubtitle, heroImageUrl, aboutTitle, aboutBody, contactEmail, contactPhone, instagramUrl, facebookUrl, sections]
    AdminLoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    AdminAuth:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
    AdminDashboard:
      type: object
      properties:
        totalOrders:
          type: integer
        totalMessages:
          type: integer
        activeProducts:
          type: integer
        pendingOrders:
          type: integer
      required: [totalOrders, totalMessages, activeProducts, pendingOrders]

